name: Publish bounded OUART Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Validate bundle safety and history preservation
        run: |
          python3 scripts/test-pages-bundle.py
          python3 scripts/test-pages-exact-artifact.py
      - name: Build bounded presentation bundle
        run: python3 scripts/build-pages-bundle.py --output _site --commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        id: upload
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        run: python3 scripts/deploy-pages-exact-artifact.py
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
